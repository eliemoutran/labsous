<!doctype html>
<html lang="en" dir="ltr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labsous — مستر لغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --ink: #eceef1;
    --mute: #9aa3ad;
    --line: #2c323a;
    --accent: #c4a35a;
    --accent-2: #dbbf7a;
    --stage: #1c2026;
    --err: #e8a090;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f1ea;
    --ink: #1c1e22;
    --mute: #5b6168;
    --line: #d8d2c6;
    --accent: #8a6b1e;
    --accent-2: #6e5518;
    --stage: #fffcf7;
    --err: #9c3d2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    min-height: 100dvh;
    font: 16px/1.5 "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    overflow-x: hidden;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.25rem 1rem calc(2.5rem + env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: .7rem;
    margin-bottom: 1rem;
  }
  .brand { display: flex; align-items: center; gap: .55rem; min-width: 0; }
  .mark {
    width: .4rem; height: 1.4rem;
    background: var(--accent);
    flex-shrink: 0;
  }
  h1 {
    margin: 0;
    font-family: "El Messiri", "IBM Plex Sans Arabic", sans-serif;
    font-size: clamp(1.2rem, 5vw, 1.65rem);
    font-weight: 700;
    line-height: 1.1;
  }
  .kicker {
    margin: .1rem 0 0;
    color: var(--mute);
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .06em;
  }
  .tools { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }
  .icon {
    width: 2.75rem; height: 2.75rem;
    display: grid; place-items: center;
    color: var(--ink);
    background: var(--stage);
    border: 1px solid var(--line);
    padding: 0;
    cursor: pointer;
  }
  .icon svg { width: 1.2rem; height: 1.2rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon:hover, .icon:focus-visible { border-color: var(--accent); color: var(--accent); }
  .icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  html[data-theme="dark"] .sun { display: none; }
  html[data-theme="light"] .moon { display: none; }
  form { margin: 0 0 1rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--stage);
    border: 1px solid var(--line);
    border-inline-start: 3px solid var(--accent);
    padding: .85rem 1rem;
    outline: none;
    border-radius: 0;
  }
  input::placeholder { color: var(--mute); }
  input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #player { margin: 0 0 1rem; background: var(--stage); display: none; }
  #player.on { display: block; }
  #player iframe {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    height: auto;
  }
  #out { margin: 0; padding: 0; list-style: none; }
  li {
    padding: 1rem 0;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  li:first-child { border-top: 0; }
  li:hover .ar { color: var(--accent-2); }
  li:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .ar {
    font-family: "El Messiri", "IBM Plex Sans Arabic", sans-serif;
    font-size: clamp(1.25rem, 5.5vw, 1.7rem);
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 .2rem;
    overflow-wrap: anywhere;
  }
  .meta { color: var(--mute); font-size: .92rem; margin: 0 0 .4rem; overflow-wrap: anywhere; }
  .meant { color: var(--ink); }
  .sum {
    color: var(--ink);
    opacity: .82;
    font-size: .95rem;
    margin: 0 0 .5rem;
    unicode-bidi: isolate;
    overflow-wrap: anywhere;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .6rem;
    flex-wrap: wrap;
  }
  .tit {
    color: var(--mute);
    font-size: .78rem;
    min-width: 0;
    flex: 1 1 12rem;
    unicode-bidi: isolate;
    overflow-wrap: anywhere;
  }
  .tit time { color: var(--accent); font-variant-numeric: tabular-nums; }
  button.copy {
    font: inherit;
    font-size: .75rem;
    font-weight: 600;
    color: var(--accent-2);
    background: transparent;
    border: 1px solid var(--line);
    padding: .5rem .7rem;
    min-height: 2.75rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.copy:hover { border-color: var(--accent); }
  button.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg { margin: 0; padding: 1.5rem 0; color: var(--mute); }
  .msg.err { color: var(--err); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<main>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>L'absous</h1>
        <p class="kicker">Mr Loughat</p>
      </div>
    </div>
    <div class="tools">
      <button type="button" class="icon" id="rand" aria-label="حلقة عشوائية" title="عشوائي">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button type="button" class="icon" id="theme" aria-label="تبديل المظهر">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>
  <form id="f">
    <label class="sr" for="q">بحث</label>
    <input id="q" name="q" type="search" enterkeyhint="search" autocomplete="off" autofocus spellcheck="false" dir="auto" placeholder="porte kleb · كومان فواتير · claire">
  </form>
  <div id="player"></div>
  <ol id="out"></ol>
</main>
<script>
const AR = {'ب':'b','ت':'t','ث':'t','ج':'j','ح':'h','خ':'x','د':'d','ذ':'z','ر':'r','ز':'z','س':'s','ش':'s','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'','غ':'g','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'','ي':'','ا':'','أ':'','إ':'','آ':'','ء':'','ؤ':'','ئ':'','ة':'','ى':'','پ':'b','ڤ':'f','چ':'j','گ':'g'};
function skel(s) {
  return s.toLowerCase().normalize('NFKD')
    .replace(/[\u0300-\u036f\u064b-\u0652\u0640]/g, '')
    .replace(/[\u0600-\u06ff]/g, c => AR[c] ?? ' ')
    .replace(/x/g, 'ks')
    .replace(/sh|ch/g, 's').replace(/kh/g, 'x').replace(/gh/g, 'g').replace(/th/g, 't').replace(/ph/g, 'f')
    .replace(/ck|qu|q/g, 'k').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k')
    .replace(/p/g, 'b').replace(/v/g, 'f')
    .replace(/7/g, 'h').replace(/5/g, 'x').replace(/6/g, 't').replace(/8/g, 'g').replace(/9/g, 's').replace(/[23]/g, '')
    .replace(/[aeiouyw]/g, '')
    .replace(/[^a-z]+/g, ' ')
    .replace(/(.)\1+/g, '$1')
    .trim();
}
const skelKey = s => skel(s).replace(/ /g, '');

const qEl = document.getElementById('q');
const out = document.getElementById('out');
const player = document.getElementById('player');
const form = document.getElementById('f');
const themeBtn = document.getElementById('theme');
let jokes = [];
let t = 0;

const theme = {
  get() { return document.documentElement.getAttribute('data-theme') || 'dark'; },
  set(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    localStorage.setItem('theme', mode);
    themeBtn.setAttribute('aria-label', mode === 'dark' ? 'تفعيل الوضع الفاتح' : 'تفعيل الوضع الداكن');
  },
};
theme.set(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
themeBtn.addEventListener('click', () => theme.set(theme.get() === 'dark' ? 'light' : 'dark'));

function mmss(s) {
  s = Math.max(0, s|0);
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function el(tag, text) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  return n;
}
function play(r) {
  const start = Math.max(0, r.t - 1);
  player.replaceChildren();
  const f = document.createElement('iframe');
  f.src = `https://www.youtube-nocookie.com/embed/${r.video_id}?start=${start}&autoplay=1&rel=0`;
  f.allow = 'autoplay; encrypted-media';
  f.allowFullscreen = true;
  f.title = r.title || r.mangled_ar || 'clip';
  player.append(f);
  player.classList.add('on');
  player.scrollIntoView({ behavior: 'smooth' });
}
function msg(text, err) {
  const p = el('p', text);
  p.className = err ? 'msg err' : 'msg';
  p.setAttribute('role', err ? 'alert' : 'status');
  out.append(p);
}
function score(row, q) {
  const ql = q.toLowerCase();
  const toks = ql.match(/[a-z0-9\u0600-\u06ff]+/g) ?? [];
  const names = [row.mangled_latin, row.mangled_ar, row.meant, ...(row.aliases || [])];
  const blob = names.join(' ').toLowerCase();
  const words = blob.split(/[^a-z0-9\u0600-\u06ff]+/).filter(w => w.length >= 2);
  let s = 0;
  if (blob.includes(ql)) s += 10;
  for (const tok of toks) {
    const tk = skelKey(tok);
    for (const w of words) {
      if (w === tok) s += 6;
      else if (tok.length >= 3 && w.includes(tok)) s += 3;
      const wk = skelKey(w);
      if (tk.length >= 3 && wk === tk) s += 4;
    }
  }
  return s;
}
function search(q) {
  out.replaceChildren();
  if (q.length < 2) return;
  history.replaceState(null, '', `?q=${encodeURIComponent(q)}`);
  const ranked = jokes.map(row => ({ row, s: score(row, q) })).filter(x => x.s > 0);
  ranked.sort((a, b) => b.s - a.s);
  const results = ranked.slice(0, 10).map(x => x.row);
  render(results, !results.length);
}
function render(results, empty) {
  out.replaceChildren();
  if (empty) { msg('ما لقينا شي — جرّب تكتبها غير شكل'); return; }
  for (const item of results) {
    const li = el('li');
    li.tabIndex = 0;
    const ar = el('div', item.mangled_ar); ar.className = 'ar'; ar.dir = 'auto';
    const meta = el('div'); meta.className = 'meta'; meta.dir = 'auto';
    meta.append(el('span', item.mangled_latin), document.createTextNode('  ·  '));
    const meant = el('span', item.meant); meant.className = 'meant';
    meta.append(meant);
    const sum = el('div', item.summary); sum.className = 'sum'; sum.dir = 'auto';
    const row = el('div'); row.className = 'row';
    const tit = el('div'); tit.className = 'tit'; tit.dir = 'auto';
    const time = el('time', mmss(item.t));
    tit.append(document.createTextNode((item.title || '') + ' · '), time);
    const btn = el('button', 'نسخ الرابط / copy');
    btn.type = 'button';
    btn.className = 'copy';
    btn.addEventListener('click', e => {
      e.stopPropagation();
      navigator.clipboard.writeText(`https://youtu.be/${item.video_id}?t=${Math.max(0, item.t - 1)}`);
      btn.textContent = 'تم النسخ';
      setTimeout(() => { btn.textContent = 'نسخ الرابط / copy'; }, 1200);
    });
    row.append(tit, btn);
    li.append(ar, meta, sum, row);
    li.addEventListener('click', () => play(item));
    li.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(item); }
    });
    out.append(li);
  }
}
function randomClip() {
  if (!jokes.length) return;
  const ids = [...new Set(jokes.map(j => j.video_id))];
  const vid = ids[Math.floor(Math.random() * ids.length)];
  const clips = jokes.filter(j => j.video_id === vid).sort((a, b) => a.t - b.t);
  const item = clips[0];
  qEl.value = '';
  history.replaceState(null, '', location.pathname);
  render(clips.slice(0, 10), false);
  play(item);
}
form.addEventListener('submit', e => { e.preventDefault(); clearTimeout(t); search(qEl.value.trim()); });
qEl.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => search(qEl.value.trim()), 250); });
document.getElementById('rand').addEventListener('click', randomClip);

fetch('jokes.json').then(r => {
  if (!r.ok) throw 0;
  return r.json();
}).then(data => {
  jokes = data;
  const init = new URLSearchParams(location.search).get('q');
  if (init) { qEl.value = init; search(init.trim()); }
}).catch(() => msg('في مشكلة، جرّب بعد شوي', true));
</script>
